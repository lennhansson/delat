<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Länkgenerator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Länkgenerator</h1>
            <p class="text-sm text-slate-500">Mata in eller klistra in en webbadress nedan.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label for="urlInput" class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Webbadress</label>
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="https://exempel.trycloudflare.com" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm"
                >
            </div>

            <div id="resultContainer" class="hidden pt-2">
                <div class="p-4 rounded-xl bg-indigo-50/50 border border-indigo-100 flex items-center justify-between">
                    <span class="text-xs font-medium text-indigo-500 uppercase tracking-wider">Resultat</span>
                    <a 
                        id="outputLink" 
                        href="#" 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        class="text-sm font-medium text-indigo-600 hover:text-indigo-700 underline truncate max-link ml-2"
                    >
                        Öppna länk
                    </a>
                </div>
            </div>
        </div>

    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const resultContainer = document.getElementById('resultContainer');
        const outputLink = document.getElementById('outputLink');

        function updateLink() {
            const value = urlInput.value.trim();

            if (value.length > 0) {
                // Säkerställ att länken har ett protokoll om det saknas
                let href = value;
                if (!href.startsWith('http://') && !href.startsWith('https://')) {
                    href = 'https://' + href;
                }

                outputLink.href = href;
                outputLink.textContent = href;
                resultContainer.classList.remove('hidden');
            } else {
                resultContainer.classList.add('hidden');
            }
        }

        // Lyssna på både input- och change-händelser för omedelbar respons
        urlInput.addEventListener('input', updateLink);
    </script>

</body>
</html>
