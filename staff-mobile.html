<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staff Mobile - Jukebox</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/staff-mobile.css">
</head>
<body>

<div class="mobile-container">
    <header class="mobile-header">JUKEBOX STAFF 📱</header>

    <!-- 1. SPELAREN -->
    <section class="mobile-section player-section">
        <div id="staff-player-container" class="mobile-yt-frame">
            <div id="staff-yt-player"></div>
        </div>

        <div class="now-playing-box">
            <div class="status-dot"></div>
            <strong id="lbl-now-playing">Laddar spelare...</strong>
        </div>

        <div class="main-controls">
            <button id="mobile-play-toggle" class="mobile-btn btn-start" onclick="togglePlayback()" aria-label="Spela upp eller pausa">▶</button>
            <button class="mobile-btn btn-skip" onclick="skipLat()">SKIP LÅT</button>
        </div>

        <div class="queue-mini">
            <h3 class="queue-title">KÖ (NÄSTA 10):</h3>
            <div id="player-queue-target" class="compact-queue"></div>
        </div>
    </section>

    <!-- 2. VÄLJ LÅTLISTOR -->
    <section class="mobile-section">
        <h2 class="section-title">BAKGRUNDSMUSIK</h2>

        <div class="input-group">
            <label for="select-main-playlist">Huvudlista (Aktiv):</label>
            <select id="select-main-playlist" onchange="bytHuvudLista()">
                <option value="">Välj lista...</option>
            </select>
        </div>

        <div class="input-group">
            <label for="select-temp-playlist">Extra lista (Tillfällig):</label>
            <select id="select-temp-playlist" onchange="bytTempLista()">
                <option value="">Ingen extra lista</option>
            </select>
        </div>
    </section>

    <!-- 3. EDITERA LÅTLISTA -->
    <section class="mobile-section" id="view-edit">
        <h2 class="section-title">EDITERA BIBLIOTEK</h2>

        <div class="input-group">
            <label for="select-edit-playlist">Välj lista att redigera:</label>
            <select id="select-edit-playlist" onchange="uppdateraEditVyMobil(this.value)">
                <option value="">Välj lista...</option>
            </select>
        </div>

        <div class="input-group" style="margin-top:12px;">
            <label for="txt-new-playlist">Eller skapa ny spellista:</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="txt-new-playlist" placeholder="Namn på ny lista..." style="flex:1; padding:8px; border-radius:4px; border:1px solid #333; background:#222; color:#fff; font-size:13px;">
                <button onclick="skapaNyListaMobil()" style="background:#1ed760; color:#000; font-weight:bold; border:none; border-radius:4px; padding:8px 12px; cursor:pointer; font-size:12px;">+ SKAPA</button>
            </div>
        </div>

        <div id="edit-view-content" style="margin-top:20px; display:none;">
            <div class="mobile-search-box">
                <input type="text" id="txt-edit-search" placeholder="Sök låt på YouTube...">
                <button onclick="sokLatTillEdit()">SÖK</button>
            </div>
            <div id="edit-search-results" class="mobile-search-results"></div>

            <div class="current-list-box">
                <h3 id="edit-view-title" style="font-size:13px; color:#888;">Låtar i listan:</h3>
                <div id="edit-song-list-target" class="compact-list"></div>
            </div>
        </div>
    </section>

    <!-- 4. MOMENTS -->
    <section class="mobile-section">
        <h2 class="section-title">MOMENTS</h2>
        <input type="text" id="moment-text-input" class="mobile-input-big" placeholder="Manuellt meddelande (valfritt)...">
        <div id="moment-trigger-summary" style="margin-top:10px; padding:8px 10px; background:#1a1a1a; border:1px solid #333; border-radius:6px; color:#ddd; font-size:11px; line-height:1.5;">
            Inga aktiva triggers ännu.
        </div>

        <div class="moment-controls">
            <select id="select-moment-type" class="mobile-input-big">
                <option value="">Välj Moment...</option>
            </select>
            <button class="mobile-btn btn-gold" style="width:100%; margin-top:10px;" onclick="const m = document.getElementById('select-moment-type').value; if(m) activateMoment(m);">AKTIVERA MOMENT</button>
        </div>
        <button id="btn-stop-moment" class="mobile-btn btn-stop" style="display:none;" onclick="stopMoment()">STOPPA MOMENT</button>
    </section>

    <!-- 5. ADMIN & STATS -->
    <footer class="mobile-footer">
        <h2 class="section-title">INSTÄLLNINGAR & STATS</h2>
        <div class="admin-row">
            <span>QR-Kuponger krävs:</span>
            <label class="toggle-switch">
                <input type="checkbox" id="chk-qr-krav" onchange="toggleQrKrav()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="stats-box">
            <div class="stat-item">
                <span class="stat-label">Kuponger:</span>
                <strong id="stat-kuponger">0</strong>
            </div>
            <div class="stat-item">
                <span class="stat-label">Totalt:</span>
                <strong id="stat-totalt">0</strong>
            </div>
        </div>

        <div style="margin-top:16px; padding-top:12px; border-top:1px solid #2a2a2a;">
            <h3 style="margin:0 0 10px 0; color:#fff; font-size:12px; letter-spacing:1px; text-transform:uppercase;">Fellogg</h3>
            <div id="pub-log-status" style="font-size:11px; color:#aaa; margin-bottom:8px;">Laddar...</div>
            <div id="pub-log-list" style="display:flex; flex-direction:column; gap:8px; font-size:11px; color:#ddd;"></div>
        </div>
    </footer>
</div>

<script src="/staff-app.js"></script>
</body>
</html>
