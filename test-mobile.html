<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jukebox</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/test-mobile.js" defer></script>
    <link rel="stylesheet" href="/test-mobile.css">
</head>
<body>
<div class="app-container">
    <header><h1 id="pub-titel">Jukebox</h1></header>
    <main>
        <div id="now-playing-container" class="card now-playing" style="display:none;">
            <div class="section-title"><span class="live-dot"></span> Just nu</div>
            <img id="np-thumb" src="" class="now-playing-thumb">
            <div id="np-title" class="song-title">-</div>
            <div id="np-meta" class="song-meta">-</div>
        </div>
        <section id="tab-queue" class="tab-content active">
            <div class="search-pill">
                <input type="text" id="query" placeholder="Sök låt..." onkeyup="if(event.key==='Enter') sök()">
                <button class="search-btn" onclick="sök()">SÖK</button>
            </div>
            <div id="results"></div>
            <h2 class="section-title">Kommande låtar</h2>
            <div id="queue-lista"></div>
        </section>
        <section id="tab-dela" class="tab-content">
            <div class="card" style="text-align:center;">
                <h2 class="section-title">Dela</h2>
                <div id="share-qr-target" style="display:flex; justify-content:center; padding:10px;"></div>
                <button class="big-btn btn-outline" onclick="delaLank()" style="margin-top:20px; width:100%;">📤 SKICKA LÄNK</button>
            </div>
        </section>
    </main>
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="bytFlik('queue')"><span>📜</span><span>Jukebox</span></button>
        <button class="nav-item" onclick="bytFlik('dela')"><span>🤝</span><span>Dela</span></button>
    </nav>
</div>
<div id="toast"></div>
</body>
</html>
