<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>Jukebox</title>

    <!-- PWA iOS Support -->
    <link rel="apple-touch-icon" href="/data/pwa-assets%20(1)/icons/icon-180x180.png">

    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/data/pwa-assets%20(1)/splash/splash-1290x2796.png">
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/data/pwa-assets%20(1)/splash/splash-1179x2556.png">
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/data/pwa-assets%20(1)/splash/splash-750x1334.png">

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="/test-mobile.js" defer></script>
    <script src="/jukebox-pwa.js" defer></script>
    <link rel="stylesheet" href="/test-mobile.css">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }
    </script>
</head>
<body>

<div id="foxbox-background" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;"></div>

<div class="app-container">
    <header><h1 id="pub-titel">Jukebox</h1></header>

    <!-- NU SPELAS (Alltid synlig överst) -->
    <div id="now-playing-container" class="card now-playing" style="display:none;">
        <div class="section-title"><span class="live-dot"></span> Just nu</div>
        <img id="np-thumb" src="" class="now-playing-thumb">
        <div id="np-title" class="song-title">-</div>
        <div id="np-meta" class="song-meta">-</div>
    </div>

    <main id="swipe-area">
        <!-- FLIK 1: JUKEBOX -->
        <section id="tab-jukebox" class="tab-content active">
            <div class="search-pill">
                <input type="text" id="query" placeholder="Vilken låt vill du höra?" onkeyup="if(event.key==='Enter') sök()">
                <button class="search-btn" onclick="sök()">SÖK</button>
            </div>
            <div id="results"></div>

            <h2 class="section-title">Kommande (Top 3)</h2>
            <div id="queue-lista"></div>
        </section>

        <!-- FLIK 2: DELA & MER -->
        <section id="tab-dela" class="tab-content">
            <div class="card" style="text-align:center;">
                <h2 class="section-title">Ditt Saldo</h2>
                <div id="saldo-info-text" style="font-size:36px; font-weight:800; color:var(--accent); margin:10px 0;">0</div>
                <button class="big-btn btn-primary" onclick="startaScanner()">➕ LADDA KUPONG</button>
                <!-- Manuellt kod-fält borttaget -->
            </div>

            <!-- Bakgrundsinställningar -->
            <div class="card" style="text-align:left;">
                <h2 class="section-title">Bakgrundsbild</h2>
                <div style="margin-bottom:15px;">
                    <div style="display:flex; justify-content:space-between; font-size:12px; color:#888; margin-bottom:5px;">
                        <label>Storlek (Zoom)</label>
                        <span id="zoom-val">100%</span>
                    </div>
                    <input type="range" id="bg-zoom" min="50" max="300" value="100" style="width:100%; accent-color:var(--accent);">
                </div>
                <div>
                    <div style="display:flex; justify-content:space-between; font-size:12px; color:#888; margin-bottom:5px;">
                        <label>Synlighet (Matthet)</label>
                        <span id="bright-val">85%</span>
                    </div>
                    <input type="range" id="bg-brightness" min="0" max="100" value="85" style="width:100%; accent-color:var(--accent);">
                </div>
            </div>

            <div class="card" style="text-align:center;">
                <h2 class="section-title">Dela till vänner</h2>
                <div id="share-qr-target" style="display:flex; justify-content:center; padding:10px;"></div>
                <button class="big-btn btn-outline" onclick="delaLank()">📤 SKICKA LÄNK</button>
            </div>

            <div id="pwa-install-container" class="card">
                <h2 class="section-title">Spara som app</h2>
                <div id="pwa-status-installed" style="display:none; text-align:center; color:#1db954;">✅ Sparad på hemskärmen</div>
                <button id="pwa-install-btn" class="big-btn btn-outline" style="display:none;"></button>
                <div id="pwa-ios-instruktion" style="display:none; font-size:13px; text-align:left; color:#ccc;"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button id="btn-tab-jukebox" class="nav-item active" onclick="bytFlik('jukebox')"><span>🎵</span><span>Jukebox</span></button>
        <button id="btn-tab-dela" class="nav-item" onclick="bytFlik('dela')"><span>🤝</span><span>Dela</span></button>
    </nav>
</div>

<div id="toast" style="display:none;"></div>
<div id="scanner-layer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:2000;">
    <div id="qr-reader" style="width:100%;"></div>
    <button class="big-btn btn-outline" onclick="stoppaScanner()">AVBRYT</button>
</div>
</body>
</html>
